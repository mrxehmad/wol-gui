# CI: build wolbox inside the official Arch Linux container.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # The minimal Arch image has no bash/sh utilities GitHub needs for its
      # step wrappers; run as root and let the pre-step below install them.
      options: --user root -e LC_ALL=C.UTF-8
    steps:
      - name: Install checkout prerequisites
        # make/gcc ship with base-devel; these are needed by actions/checkout.
        run: pacman -Sy --noconfirm --needed git sed grep tar findutils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed gtk3 pkgconf

      - name: Build
        run: make

      - name: Smoke check (binary exists and links only against expected libs)
        run: |
          test -x ./wolbox
          file ./wolbox
          ldd ./wolbox | grep -E 'libgtk-3|libc\.so'
          # namcap is a nice-to-have; do not fail CI if unavailable.
          if command -v namcap >/dev/null 2>&1; then
            namcap ./wolbox || true
          fi

      - name: Stage install check (DESTDIR/PREFIX support)
        run: |
          make DESTDIR="$PWD/pkgtest" PREFIX=/usr install
          test -x pkgtest/usr/bin/wolbox
          test -f pkgtest/usr/share/applications/wolbox.desktop
          test -f pkgtest/usr/share/icons/hicolor/scalable/apps/wolbox.svg
