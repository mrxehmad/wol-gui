<?xml version="1.0" encoding="UTF-8"?>
<!-- wolbox icon: power symbol radiating a wake signal -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3556a4"/>
      <stop offset="1" stop-color="#1d2f5c"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="24" fill="url(#bg)" stroke="#101a33" stroke-width="3"/>
  <!-- radiating waves -->
  <g fill="none" stroke="#7fd4ff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <path d="M 88 40 A 34 34 0 0 1 88 88"/>
    <path d="M 100 28 A 50 50 0 0 1 100 100"/>
  </g>
  <!-- power symbol -->
  <circle cx="52" cy="64" r="26" fill="none" stroke="#ffffff" stroke-width="8"
          stroke-dasharray="122 42" transform="rotate(-105 52 64)"/>
  <line x1="52" y1="30" x2="52" y2="60" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
</svg>
