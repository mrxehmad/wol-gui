# Release: build a binary tarball on tag push and publish a GitHub Release.
# NOTE: The optional aur-publish job is intentionally commented out because
# AUR registration is currently closed. Uncomment it (and set the
# AUR_SSH_PRIVATE_KEY repository secret) once you can submit the package.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      # The minimal Arch image has no bash/sh utilities GitHub needs for its
      # step wrappers; run as root and let the first step install them.
      options: --user root -e LC_ALL=C.UTF-8
    permissions:
      contents: write
    steps:
      - name: Install dependencies
        # make/gcc ship with base-devel; the rest are used by checkout/build/packaging.
        run: pacman -Sy --noconfirm --needed git sed grep tar findutils coreutils gtk3 pkgconf

      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package binary tarball
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="wolbox-${VERSION}-x86_64"
          mkdir -p "$STAGE"
          cp wolbox "$STAGE"/
          cp data/wolbox.desktop "$STAGE"/
          cp data/wolbox.svg "$STAGE"/
          cp LICENSE README.md "$STAGE"/
          tar czf "${STAGE}.tar.gz" "$STAGE"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sumfile=${STAGE}.tar.gz.sha256" >> "$GITHUB_OUTPUT"
          ls -l "${STAGE}.tar.gz"*

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.sumfile }}

  # ---------------------------------------------------------------------
  # Optional: automatically push the updated PKGBUILD to the AUR.
  # Disabled for now (AUR account/package registration is closed).
  # To enable: uncomment this whole job AND add the repository secret
  # AUR_SSH_PRIVATE_KEY (an SSH private key whose public half is added to
  # your AUR account). The `if:` below skips the job when the secret is
  # missing; note that `secrets.*` cannot be referenced at job level, so
